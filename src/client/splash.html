<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Delve</title>
    <!-- Featherweight on purpose: this renders inline in the Reddit feed, so it gets
         no imports, no framework, and now no images either.

         It used to be a fan of three card illustrations. The cards are gone with the
         deck (ART.md § Delete the 14 card illustrations), and the replacement is the
         v5 mockup's own screen 01 — the feed card — drawn entirely in CSS: the fire
         glow, the title, the twelve-square depth strip. **Zero bytes of art.**

         Stage 4 made the numbers real: `splash-init.ts` fetches `/api/feed` and
         fills in today's descent count and yesterday's grid shape. **The markup below
         is the fallback and it must stay honest on its own** — a feed impression that
         cannot reach the server still renders a complete card, so nothing here may
         claim a number. That is why the strip ships as a shape and the stat line
         ships empty rather than as a plausible-looking placeholder.

         Do NOT add the 400x320 backdrops here; atmosphere is not worth 40KB in a
         feed. -->
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 12px;
        background: #0e1013;
        color: #f2f4f9;
        font: 600 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        font-variant-numeric: tabular-nums;
        text-align: center;
      }

      .splash {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        max-width: 340px;
      }

      /* The card: a lit shaft mouth. All gradient, no asset. */
      .card {
        position: relative;
        overflow: hidden;
        padding: 34px 16px 18px;
        background: linear-gradient(180deg, #241a13, #0a0b10);
        box-shadow: inset 0 0 0 1px #2a2f3a;
      }

      .card::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -40px;
        width: 280px;
        height: 180px;
        margin-left: -140px;
        pointer-events: none;
        background: radial-gradient(
          ellipse at 50% 100%,
          rgb(255 186 105 / 35%),
          transparent 68%
        );
        animation: flicker 4s ease-in-out infinite;
      }

      /* transform only — an `opacity: 0` first frame in a backgrounded tab renders an
         invisible splash, which is the one thing this file cannot be. */
      @keyframes flicker {
        37% {
          transform: scale(1.04);
        }
        62% {
          transform: scale(0.98);
        }
      }

      .ttl {
        position: relative;
        font: 700 26px/1.25 ui-monospace, "Courier New", monospace;
        letter-spacing: 0.04em;
        text-shadow: 0 3px 0 #000, 0 0 30px rgb(255 186 105 / 60%);
      }

      .sub2 {
        position: relative;
        margin-top: 12px;
        font: 700 10px/1.8 ui-monospace, "Courier New", monospace;
        letter-spacing: 0.2em;
        color: #ffbc6a;
      }

      /* The depth strip: the share grid's alphabet, one row, spoiler-free. */
      .strip {
        position: relative;
        display: flex;
        gap: 4px;
        justify-content: center;
        margin-top: 20px;
      }

      .strip i {
        width: 20px;
        height: 20px;
        background: #1e232d;
        box-shadow: inset 0 0 0 1px #000;
      }

      /* The same lightness ladder as the in-app grid — see game.css § THE SECOND
         CHANNEL. Four hues alone cannot carry this, and the feed card is seen by more
         people than any other surface in the game. */
      .strip i.f {
        background: linear-gradient(160deg, #c3f5d6, #57b57e);
      }
      .strip i.h {
        background: linear-gradient(160deg, #f0cf74, #9a761a);
      }
      .strip i.c {
        background: linear-gradient(160deg, #d8823f, #7c3610);
      }
      /* `dead` inverts rather than darkening further: at this size a very dark red
         and the unreached grey are the same cell in greyscale, so the death mark
         reads by SHAPE — a light core in a dark ring, the design's "red + white pip".
         Same trick as the board trace in game.css. */
      .strip i.d {
        background: #ffd9d3;
        box-shadow: inset 0 0 0 6px #6d1a16, inset 0 0 0 7px #000;
      }

      /* Empty until `/api/feed` answers, and it collapses rather than reserving a
         gap — a card that keeps room for a number it never gets looks broken. */
      .stat2:empty {
        display: none;
      }

      .stat2 {
        position: relative;
        margin-top: 16px;
        font-size: 12px;
        font-weight: 400;
        color: #cdd4e2;
      }

      .stat2 b {
        color: #fff;
        font-weight: 700;
      }

      .blurb {
        position: relative;
        margin-top: 18px;
        font-weight: 400;
        font-size: 12px;
        line-height: 1.5;
        color: #cdd4e2;
      }

      .blurb b {
        color: #fff;
        font-weight: 700;
      }

      .play-btn {
        width: 100%;
        padding: 14px 24px;
        border: none;
        color: #fff;
        font: 700 13px/1 ui-monospace, "Courier New", monospace;
        letter-spacing: 0.08em;
        cursor: pointer;
        touch-action: manipulation;
        background: linear-gradient(180deg, #a58a49, #6e5427 45%, #3a2b14);
        box-shadow:
          inset 0 0 0 1px #000,
          inset 0 2px 0 rgb(255 235 180 / 45%),
          0 4px 0 #1c150b,
          0 0 26px rgb(226 184 84 / 32%);
      }

      .play-btn:active {
        transform: translateY(3px);
        box-shadow: inset 0 0 0 1px #000, 0 1px 0 #1c150b;
      }

      .play-btn span {
        display: block;
        margin-top: 6px;
        font-size: 9px;
        letter-spacing: 0.14em;
        color: #fff2d4;
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="card">
        <div class="ttl">DAILY<br />DELVE</div>
        <div class="sub2">12 DEPTHS &middot; ONE SHAFT</div>
        <div class="strip" id="strip">
          <i class="f"></i><i class="f"></i><i class="f"></i><i class="h"></i>
          <i class="h"></i><i class="c"></i><i class="f"></i><i class="h"></i>
          <i class="h"></i><i class="c"></i><i></i><i></i>
        </div>
        <div class="stat2" id="stat"></div>
        <div class="blurb">
          Everyone in this subreddit descends the <b>same shaft</b> today. Same
          abilities on offer, same enemies, same everything. One score to compare.
        </div>
      </div>
      <button id="play-btn" class="play-btn">
        DESCEND<span>~4 MIN &middot; ONE ATTEMPT</span>
      </button>
    </div>
    <script type="module" src="splash-init.ts"></script>
  </body>
</html>
